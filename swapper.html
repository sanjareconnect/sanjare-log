<!DOCTYPE html>
<html>
<head>
  <title>Trip Swapper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e6f0ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      color: #1a2b4c;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-size: 13px;
      color: #333;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0ca678, #087f5b);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    /* 🔥 BUFFER ANIMATION */
    .animation {
      margin-top: 20px;
      font-size: 24px;
      display: none;
      letter-spacing: 4px;
      animation: flow 1s infinite linear;
    }

    @keyframes flow {
      0% { letter-spacing: 2px; opacity: 0.6; }
      50% { letter-spacing: 8px; opacity: 1; }
      100% { letter-spacing: 2px; opacity: 0.6; }
    }

    .blink {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
      display: none;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% {opacity: 1;}
      50% {opacity: 0.3;}
      100% {opacity: 1;}
    }
  </style>
</head>

<body>

<div class="container">

  <h2>🔄 Trip Swapper</h2>

  <!-- UN NAME -->
  <label>Trip Swapper UN Name:</label>
  <select id="driver">
    <option value="">Select UN Name</option>
    <option>Mithin Mohan / SJTW-7770</option>
    <option>Nagaraj Mani / SJTW-8047</option>
  </select>

  <!-- CODE -->
  <label>T-Swapper Code:</label>
  <input type="text" id="code" placeholder="Enter Code">

  <!-- CMR -->
  <label>CMR:</label>
  <input type="number" id="cmr" placeholder="Enter CMR Number">

  <!-- BUTTON -->
  <button onclick="startProcess()">T-Swap Fetch Details</button>

  <!-- ANIMATION -->
  <div class="animation" id="animationBox"></div>

  <!-- BLINK TEXT -->
  <div class="blink" id="loadingText">
    Please wait Fetching data from Sanjar-E-Smart Grid Control Station
  </div>

</div>

<script>

function startProcess() {

  let driver = document.getElementById("driver").value;
  let code = document.getElementById("code").value;
  let cmr = document.getElementById("cmr").value;

  if (driver === "" || code === "" || cmr === "") {
    alert("Please fill all fields");
    return;
  }

  const anim = document.getElementById("animationBox");
  const text = document.getElementById("loadingText");

  anim.style.display = "block";
  text.style.display = "block";

  // 🔄 FORWARD FLOW (3 sec)
  anim.innerHTML = "👨‍✈️ ➤➤➤ 📱 ➤➤➤ ☁️ ➤➤➤ 🏢";

  setTimeout(() => {
    // 🔄 REVERSE FLOW (3 sec)
    anim.innerHTML = "🏢 ➤➤➤ ☁️ ➤➤➤ 📱 ➤➤➤ 👨‍✈️";
  }, 3000);

  setTimeout(() => {
    anim.style.display = "none";
    text.style.display = "none";
  }, 6000);

}

</script>

</body>
</html>
