<!DOCTYPE html>
<html>
<head>
  <title>Trip Swapper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e6f0ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 380px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-top: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      background: linear-gradient(135deg,#0ca678,#087f5b);
      color: white;
      font-weight: 600;
    }

    .result, .consent, .jobBox, .swapExtra {
      display: none;
      margin-top: 15px;
      background: white;
      padding: 12px;
      border-radius: 10px;
    }

    .animation {
      text-align: center;
      font-size: 20px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

<h3>🔄 Trip Swapper</h3>

<select id="driver">
<option value="">Select</option>
<option>Mithin Mohan / SJTW-7770</option>
<option>Nagaraj Mani / SJTW-8047</option>
</select>

<input id="code" placeholder="T-Swapper Code">
<input id="cmr" placeholder="CMR">

<button onclick="startProcess()">T-Swap Fetch Details</button>

<div id="anim" class="animation"></div>

<div class="result" id="resultBox">
<p><b>Swapper:</b> <span id="resSwapper"></span></p>
<p><b>Pickup:</b> <span id="resPickup"></span></p>
<p><b>Destination:</b> <span id="resDestination"></span></p>
<p><b>Start:</b> <span id="resStartTime"></span></p>
<p><b>Swap:</b> <span id="resSwapLocation"></span></p>
<p><b>Swapee:</b> <span id="resSwapee"></span></p>
<p><b>Mobile:</b> <span id="resMobile"></span></p>
</div>

<div class="consent" id="consentBox">
<input type="checkbox" id="acceptCheck"> I accept the swap
</div>

<!-- UN JOB -->
<div class="jobBox" id="jobBox">
<label>UN-Job No</label>
<input id="jobNo">
</div>

<!-- NEW SECTION -->
<div class="swapExtra" id="swapExtra">

<label>Swap Time</label>
<input id="swapTime" readonly>

<label>Swap Location</label>
<input id="swapGPS" readonly>

<button onclick="swapChecker()">T-Swap Checker</button>

<div id="checkAnim" class="animation"></div>

</div>

</div>

<script>

function startProcess(){

let code=document.getElementById("code").value;

let anim=document.getElementById("anim");
anim.style.display="block";

let frames=["👨‍✈️➡️📱➡️☁️➡️🏢","🏢➡️☁️➡️📱➡️👨‍✈️"];
let i=0;
let interval=setInterval(()=>{ anim.innerHTML=frames[i++%2]; },400);

fetch("https://script.google.com/macros/s/AKfycbynohJZXhLwaqh33kxpcPAQleQMK1LidZSgouT7DQjxTqkTsZ6kkknskS0Y4LUpUZvEdA/exec?code="+code)
.then(r=>r.json())
.then(d=>{
clearInterval(interval);
anim.style.display="none";

if(d.status==="found"){

document.getElementById("resSwapper").innerText=d.swapper;
document.getElementById("resPickup").innerText=d.pickup;
document.getElementById("resDestination").innerText=d.destination;

let dt=new Date(d.startTime);
document.getElementById("resStartTime").innerText=dt.toLocaleString();

document.getElementById("resSwapLocation").innerText=d.swapLocation;
document.getElementById("resSwapee").innerText=d.swapee;
document.getElementById("resMobile").innerText=d.mobile;

document.getElementById("resultBox").style.display="block";
document.getElementById("consentBox").style.display="block";
document.getElementById("jobBox").style.display="block";
document.getElementById("swapExtra").style.display="block";

}
});
}

function swapChecker(){

if(!document.getElementById("acceptCheck").checked){
alert("Please accept the terms and conditions");
return;
}

let anim=document.getElementById("checkAnim");
anim.style.display="block";

let frames=["📡➡️☁️➡️🏢","🏢➡️☁️➡️📡"];
let i=0;
let interval=setInterval(()=>{anim.innerHTML=frames[i++%2];},400);

/* AUTO TIME */
document.getElementById("swapTime").value=new Date().toLocaleString();

/* AUTO GPS */
navigator.geolocation.getCurrentPosition(async pos=>{
let res=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`);
let data=await res.json();
document.getElementById("swapGPS").value=data.display_name;
});

setTimeout(()=>{
clearInterval(interval);
anim.style.display="none";
},3000);

}

</script>

</body>
</html>
