<!DOCTYPE html>
<html>
<head>
  <title>Trip Swapper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e6f0ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      color: #1a2b4c;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-size: 13px;
      color: #333;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0ca678, #087f5b);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    .animation {
      margin-top: 20px;
      font-size: 22px;
      display: none;
    }

    .blink {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
      display: none;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% {opacity: 1;}
      50% {opacity: 0.3;}
      100% {opacity: 1;}
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      text-align: left;
      display: none;
    }

    .result p {
      margin: 6px 0;
      font-size: 14px;
    }

  </style>
</head>

<body>

<div class="container">

  <h2>🔄 Trip Swapper</h2>

  <label>Trip Swapper UN Name:</label>
  <select id="driver">
    <option value="">Select UN Name</option>
    <option>Mithin Mohan / SJTW-7770</option>
    <option>Nagaraj Mani / SJTW-8047</option>
  </select>

  <label>T-Swapper Code:</label>
  <input type="text" id="code" placeholder="Enter Code">

  <label>CMR:</label>
  <input type="number" id="cmr" placeholder="Enter CMR Number">

  <button onclick="startProcess()">T-Swap Fetch Details</button>

  <div class="animation" id="animationBox"></div>

  <div class="blink" id="loadingText">
    Please wait Fetching data from Sanjar-E-Smart Grid Control Station
  </div>

  <div class="result" id="resultBox">
    <p><b>T-Swapper UN:</b> <span id="resSwapper"></span></p>
    <p><b>T-Swapee:</b> <span id="resSwapee"></span></p>
    <p><b>Trip Pickup:</b> <span id="resPickup"></span></p>
    <p><b>Trip Destination:</b> <span id="resDestination"></span></p>
    <p><b>Swap Location:</b> <span id="resSwapLocation"></span></p>
    <p><b>Generator:</b> <span id="resGenerator"></span></p>
    <p><b>Code:</b> <span id="resCode"></span></p>
    <p><b>CMR:</b> <span id="resCMR"></span></p>
  </div>

</div>

<script>

function startProcess() {

  let driver = document.getElementById("driver").value;
  let code = document.getElementById("code").value;
  let cmr = document.getElementById("cmr").value;

  if (driver === "" || code === "" || cmr === "") {
    alert("Please fill all fields");
    return;
  }

  const anim = document.getElementById("animationBox");
  const text = document.getElementById("loadingText");
  const resultBox = document.getElementById("resultBox");

  resultBox.style.display = "none";

  anim.style.display = "block";
  text.style.display = "block";

  anim.innerHTML = "👨‍✈️ ➡️ 📱 ➡️ ☁️ ➡️ 🏢";

  setTimeout(() => {
    anim.innerHTML = "🏢 ➡️ ☁️ ➡️ 📱 ➡️ 👨‍✈️";
  }, 3000);

  setTimeout(() => {

    fetch("https://script.google.com/macros/s/AKfycby8anaeBo0RF6RNpT0yIn_KGP9DudFH4K9L9NxoqGBxS3Ze87QGEanscx0TQiTYvl_VVQ/exec?code=" + code)
      .then(res => res.json())
      .then(data => {

        if (data.status === "found") {

          document.getElementById("resSwapper").innerText = data.swapper;
          document.getElementById("resSwapee").innerText = data.swapee;
          document.getElementById("resPickup").innerText = data.pickup;
          document.getElementById("resDestination").innerText = data.destination;
          document.getElementById("resSwapLocation").innerText = data.swapLocation;
          document.getElementById("resGenerator").innerText = data.generator;
          document.getElementById("resCode").innerText = data.code;
          document.getElementById("resCMR").innerText = data.cmr;

          resultBox.style.display = "block";

        } else {
          alert("No matching T-Swapper Code found");
        }

      });

    anim.style.display = "none";
    text.style.display = "none";

  }, 6000);

}

</script>

</body>
</html>
