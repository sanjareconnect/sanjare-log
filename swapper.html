<!DOCTYPE html>
<html>
<head>
  <title>Trip Swapper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e6f0ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      color: #1a2b4c;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ca678, #087f5b);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .animation {
      margin-top: 20px;
      font-size: 22px;
      display: none;
    }

    .blink {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      display: none;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: none;
      text-align: left;
    }

    .result p {
      margin: 5px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .result b {
      color: #1a2b4c;
    }

    .consent {
      display: none;
      margin-top: 15px;
      text-align: left;
      font-size: 13px;
      color: #333;
    }

    .consent label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      font-weight: normal;
    }

    .consent input {
      margin-top: 3px;
      cursor: pointer;
    }

  </style>
</head>

<body>

<div class="container">

  <h2>🔄 Trip Swapper</h2>

  <label>Trip Swapper UN Name:</label>
  <select id="driver">
    <option value="">Select</option>
    <option>Mithin Mohan / SJTW-7770</option>
    <option>Nagaraj Mani / SJTW-8047</option>
  </select>

  <label>T-Swapper Code:</label>
  <input type="text" id="code">

  <label>CMR:</label>
  <input type="number" id="cmr">

  <button onclick="startProcess()">T-Swap Fetch Details</button>

  <div class="animation" id="animationBox"></div>

  <div class="blink" id="loadingText">
    Please wait Fetching data from Sanjar-E-Smart Grid Control Station - Do not refresh the page
  </div>

  <div class="result" id="resultBox">
    <p><b>T-Swapper UN:</b> <span id="resSwapper"></span></p>
    <p><b>Trip Pickup:</b> <span id="resPickup"></span></p>
    <p><b>Trip Destination:</b> <span id="resDestination"></span></p>
    <p><b>Trip Start Time:</b> <span id="resStartTime"></span></p>
    <p><b>Swap Location:</b> <span id="resSwapLocation"></span></p>
    <p><b>T-Swapee Name:</b> <span id="resSwapee"></span></p>
    <p><b>T-Swapee Mobile:</b> <span id="resMobile"></span></p>
  </div>

  <!-- ✅ CONSENT CHECKBOX -->
  <div class="consent" id="consentBox">
    <label>
      <input type="checkbox" id="acceptCheck">
      <span>I accept the above swapping and agree to all terms and conditions</span>
    </label>
  </div>

</div>

<script>

function startProcess() {

  let driver = document.getElementById("driver").value;
  let code = document.getElementById("code").value.trim();
  let cmr = document.getElementById("cmr").value;

  if (driver === "" || code === "" || cmr === "") {
    alert("Please fill all fields");
    return;
  }

  const anim = document.getElementById("animationBox");
  const text = document.getElementById("loadingText");
  const resultBox = document.getElementById("resultBox");
  const consentBox = document.getElementById("consentBox");

  // RESET
  resultBox.style.display = "none";
  consentBox.style.display = "none";
  document.getElementById("acceptCheck").checked = false;

  // SHOW loading
  anim.style.display = "block";
  text.style.display = "block";

  let step = 0;
  const frames = [
    "👨‍✈️ ➡️ 📱 ➡️ ☁️ ➡️ 🏢",
    "👨‍✈️ ➡️ 📱 ➡️ ☁️ ➡️ 🏢 .",
    "👨‍✈️ ➡️ 📱 ➡️ ☁️ ➡️ 🏢 ..",
    "🏢 ➡️ ☁️ ➡️ 📱 ➡️ 👨‍✈️",
    "🏢 ➡️ ☁️ ➡️ 📱 ➡️ 👨‍✈️ ."
  ];

  const interval = setInterval(() => {
    anim.innerHTML = frames[step % frames.length];
    step++;
  }, 400);

  fetch("https://script.google.com/macros/s/AKfycbynohJZXhLwaqh33kxpcPAQleQMK1LidZSgouT7DQjxTqkTsZ6kkknskS0Y4LUpUZvEdA/exec?code=" + encodeURIComponent(code))
    .then(res => res.json())
    .then(data => {

      clearInterval(interval);

      if (data.status === "found") {

        document.getElementById("resSwapper").innerText = data.swapper || "-";
        document.getElementById("resPickup").innerText = data.pickup || "-";
        document.getElementById("resDestination").innerText = data.destination || "-";

        let formattedTime = "-";
        if (data.startTime && data.startTime !== "-") {
          let dt = new Date(data.startTime);
          formattedTime = dt.toLocaleString("en-IN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          });
        }

        document.getElementById("resStartTime").innerText = formattedTime;
        document.getElementById("resSwapLocation").innerText = data.swapLocation || "-";
        document.getElementById("resSwapee").innerText = data.swapee || "-";
        document.getElementById("resMobile").innerText = data.mobile || "-";

        resultBox.style.display = "block";
        consentBox.style.display = "block"; // ✅ SHOW CHECKBOX

      } else {
        alert("No matching T-Swapper Code found");
      }

    })
    .catch(() => {
      clearInterval(interval);
      alert("Error connecting to control station");
    })
    .finally(() => {
      anim.style.display = "none";
      text.style.display = "none";
    });

}

</script>

</body>
</html>
