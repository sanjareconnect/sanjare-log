<!DOCTYPE html>
<html>
<head>
  <title>Trip Swapper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e6f0ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      color: #1a2b4c;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ca678, #087f5b);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .animation {
      margin-top: 20px;
      font-size: 22px;
      display: none;
    }

    .blink {
      margin-top: 10px;
      font-size: 12px; /* 🔥 slightly smaller */
      color: #666;
      display: none;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: none;
      text-align: left;
    }

    .result p {
      margin: 5px 0;
      font-size: 13px; /* 🔥 FIXED FONT SIZE */
      line-height: 1.5;
    }

    .result b {
      color: #1a2b4c;
      font-weight: 600;
    }

  </style>
</head>

<body>

<div class="container">

  <h2>🔄 Trip Swapper</h2>

  <label>Trip Swapper UN Name:</label>
  <select id="driver">
    <option value="">Select</option>
    <option>Mithin Mohan / SJTW-7770</option>
    <option>Nagaraj Mani / SJTW-8047</option>
  </select>

  <label>T-Swapper Code:</label>
  <input type="text" id="code">

  <label>CMR:</label>
  <input type="number" id="cmr">

  <button onclick="startProcess()">T-Swap Fetch Details</button>

  <div class="animation" id="animationBox"></div>

  <!-- ✅ UPDATED TEXT -->
  <div class="blink" id="loadingText">
    Please wait Fetching data from Sanjar-E-Smart Grid Control Station - Do not refresh the page
  </div>

  <div class="result" id="resultBox">
    <p><b>T-Swapper UN:</b> <span id="resSwapper"></span></p>
    <p><b>Trip Pickup:</b> <span id="resPickup"></span></p>
    <p><b>Trip Destination:</b> <span id="resDestination"></span></p>
    <p><b>Trip Start Time:</b> <span id="resStartTime"></span></p>
    <p><b>Swap Location:</b> <span id="resSwapLocation"></span></p>
    <p><b>T-Swapee Name:</b> <span id="resSwapee"></span></p>
    <p><b>T-Swapee Mobile:</b> <span id="resMobile"></span></p>
  </div>

</div>

<script>

/* KEEP YOUR EXISTING JS SAME (NO CHANGE NEEDED) */

</script>

</body>
</html>
