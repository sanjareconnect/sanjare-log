<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trip Swap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 40px;
        }

        .box {
            width: 200px;
            height: 150px;
            background-color: #4CAF50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .box:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Trip Swapper Box -->
        <div class="box" onclick="goToSwapper()">
            Trip Swapper
        </div>

        <!-- Trip Swappee Box -->
        <div class="box" onclick="goToSwappee()">
            Trip Swappee
        </div>
    </div>

    <script>
        function goToSwapper() {
            window.location.href = "T-Swapper.html";
        }

        function goToSwappee() {
            window.location.href = "T-Swappee.html";
        }
    </script>

</body>
</html>
